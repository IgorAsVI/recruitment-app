
<mat-expansion-panel class="filter-panel">
  <mat-expansion-panel-header>
    <mat-panel-title>
      Filtrar Vagas
    </mat-panel-title>
    <mat-panel-description>
      Refine a sua pesquisa por área, tipo ou localização
    </mat-panel-description>
  </mat-expansion-panel-header>

  <form [formGroup]="filterForm" (ngSubmit)="applyFilters()">
    <div class="filter-controls">
      <!-- Area Filter -->
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Área</mat-label>
        <mat-select formControlName="area">
          <mat-option value="">Todas</mat-option>
          <mat-option *ngFor="let area of areas" [value]="area">{{ area }}</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Type Filter -->
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Tipo de Vaga</mat-label>
        <mat-select formControlName="type">
          <mat-option value="">Todos</mat-option>
           <mat-option *ngFor="let type of types" [value]="type">{{ type }}</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Location Filter -->
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Localização</mat-label>
        <input matInput formControlName="location" placeholder="Ex: Lisboa">
      </mat-form-field>

      <!-- Action Buttons -->
      <div class="filter-actions">
        <button mat-raised-button color="primary" type="submit">Aplicar Filtros</button>
        <button mat-button type="button" (click)="resetFilters()">Limpar Filtros</button>
      </div>
    </div>
  </form>
</mat-expansion-panel>
