
<div class="vacancy-list-container">
  <!-- Loading Indicator -->
  <div *ngIf="loading" class="loading-indicator">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage && !loading" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <!-- Vacancy List -->
  <div *ngIf="vacancies$ | async as vacancies">
    <div *ngIf="!loading && vacancies.length > 0">
      <mat-list>
        <mat-list-item *ngFor="let vacancy of vacancies" class="vacancy-item">
          <div matListItemTitle class="vacancy-title">{{ vacancy.title }}</div>
          <div matListItemLine class="vacancy-subtitle">{{ vacancy.location }} | {{ vacancy.type }} | Área: {{ vacancy.area }}</div>
          <div matListItemLine class="vacancy-description">{{ vacancy.description | slice:0:150 }}...</div>
          <div matListItemLine class="vacancy-date"><small>Publicado em: {{ vacancy.postedDate | date:'dd/MM/yyyy' }}</small></div>
          <div matListItemMeta class="vacancy-actions">
             
            <button mat-stroked-button color="primary" (click)="viewDetails(vacancy.id)">Ver Detalhes</button>
            <button mat-raised-button color="accent" (click)="apply(vacancy.id)" class="apply-button">Candidatar-se</button>
          </div>
        </mat-list-item>
         <mat-divider></mat-divider>
      </mat-list>
    </div>

    <!-- No Vacancies Found -->
    <div *ngIf="!loading && vacancies.length === 0 && !errorMessage" class="no-vacancies-message">
      Nenhuma vaga encontrada com os filtros atuais.
    </div>
  </div>

   <!-- Initial state or error loading -->
   <div *ngIf="!(vacancies$ | async) && !loading && !errorMessage" class="no-vacancies-message">
      Utilize os filtros para procurar vagas.
   </div>

</div>
