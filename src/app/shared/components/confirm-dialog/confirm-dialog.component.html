<div class="confirm-dialog">
  <div class="dialog-header" [ngClass]="data.type">
    <mat-icon class="dialog-icon">{{ getIcon() }}</mat-icon>
    <h2 mat-dialog-title>{{ data.title }}</h2>
  </div>

  <mat-dialog-content>
    <p class="dialog-message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button 
      *ngIf="data.showCancel"
      mat-button 
      (click)="onCancel()">
      {{ data.cancelText }}
    </button>
    <button 
      mat-raised-button 
      [color]="getColor()"
      (click)="onConfirm()">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
